    - name: Attest build provenance (resume_pack.zip)
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: artifacts/${{ env.RUN_ID }}/resume_pack.zip

    - name: Attest build provenance (lockpack_evidence.zip)
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: artifacts/${{ env.RUN_ID }}/lockpack_evidence-${{ env.RUN_ID }}.zip

    - name: Download attestation bundles (resume + evidence) + trusted root (include as artifact)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        mkdir -p evidence/attestations
        pushd evidence/attestations >/dev/null

        SUBJECTS=(
          "$GITHUB_WORKSPACE/artifacts/${RUN_ID}/resume_pack.zip"
          "$GITHUB_WORKSPACE/artifacts/${RUN_ID}/lockpack_evidence-${RUN_ID}.zip"
        )

        for s in "${SUBJECTS[@]}"; do
          echo "Downloading attestation bundle for: $s"
          d="$(sha256sum "$s" | awk '{print $1}')"

          tmp="$(mktemp)"
          ok=0
          for i in 1 2 3 4 5; do
            if gh attestation download --repo "${GITHUB_REPOSITORY}" "$s" >"$tmp"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

          found=0
          for cand in "sha256_${d}.jsonl" "sha256-${d}.jsonl" "sha256:${d}.jsonl"; do
            [ -f "$cand" ] && found=1
          done

          if [ "$found" -eq 0 ]; then
            test -s "$tmp"
            mv "$tmp" "sha256_${d}.jsonl"
          else
            rm -f "$tmp"
          fi
        done

        gh attestation trusted-root > trusted_root.jsonl
        ls -la

        popd >/dev/null

    - name: Sanitize attestation filenames (no colon)
      shell: bash
      run: |
        set -euo pipefail

        sanitize_dir () {
          d="$1"
          [ -d "$d" ] || return 0
          find "$d" -maxdepth 1 -type f -name '*:*' -print0 | while IFS= read -r -d '' f; do
            nf="${f//:/_}"
            echo "rename: $f -> $nf"
            mv "$f" "$nf"
          done
        }

        sanitize_dir "."
        sanitize_dir "evidence/attestations"
        sanitize_dir "artifacts/${RUN_ID}"

    - name: Upload attestation bundle
      uses: actions/upload-artifact@v4
      with:
        name: lockpack-attestations
        path: evidence/attestations/*.jsonl
        if-no-files-found: error

    - name: Upload evidence artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lockpack-${{ env.RUN_ID }}
        path: |
          evidence/${{ env.RUN_ID }}/QG.json
          snapshots/${{ env.RUN_ID }}/manifest.json
          artifacts/${{ env.RUN_ID }}/resume_pack.zip
          ${{ env.EVIDENCE_ZIP }}
          artifacts/${{ env.RUN_ID }}/attestation_verify.json
          artifacts/${{ env.RUN_ID }}/attestation_bundle.jsonl
          artifacts/${{ env.RUN_ID }}/trusted_root.jsonl

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
