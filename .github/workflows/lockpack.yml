name: lockpack

on:
  pull_request:
    branches: [ main ]
  merge_group: {}
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/lockpack.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: lockpack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockpack:
    name: lockpack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set commit status pending (lockpack)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="lockpack" \
            -f description="LOCKPACK running (GATE 2)" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Init RUN_ID
        shell: bash
        run: |
          set -euo pipefail
          echo "RUN_ID=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "SIG=PYMGBZ" >> "$GITHUB_ENV"

      - name: Build evidence + snapshot + resume (bootstrap)
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y zip
          fi

          mkdir -p "evidence/${RUN_ID}" "snapshots/${RUN_ID}" "resume/${RUN_ID}"

          cat > "evidence/${RUN_ID}/QG.json" <<EOF
          {
            "run_id": "${RUN_ID}",
            "commit": "${GITHUB_SHA}",
            "overall_status": "FIX_TO_PASS",
            "runtime_errors_count": 0,
            "pending_count": 0,
            "sig": "${SIG}"
          }
          EOF

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          run_id = os.environ["RUN_ID"]
          root = Path("evidence")/run_id
          snap = Path("snapshots")/run_id
          snap.mkdir(parents=True, exist_ok=True)

          def sha256(p: Path):
            h = hashlib.sha256()
            with p.open("rb") as f:
              for ch in iter(lambda: f.read(1024*1024), b""):
                h.update(ch)
            return h.hexdigest()

          files = sorted([p for p in root.rglob("*") if p.is_file()])
          manifest = {
            "run_id": run_id,
            "sha256": {str(p.relative_to(root)).replace("\\","/"): sha256(p) for p in files}
          }

          (root/"manifest.json").write_text(json.dumps(manifest, indent=2, ensure_ascii=False), encoding="utf-8")
          (snap/"manifest.json").write_text(json.dumps(manifest, indent=2, ensure_ascii=False), encoding="utf-8")
          PY

          echo "LOCKPACK RESUME run_id=${RUN_ID} commit=${GITHUB_SHA}" > "resume/${RUN_ID}/resume.txt"

          ( cd "evidence/${RUN_ID}" && zip -X -r "../../lockpack_evidence-${RUN_ID}.zip" . )
          ( cd "resume/${RUN_ID}"   && zip -X -r "../../resume_pack.zip" . )

          test -f "lockpack_evidence-${RUN_ID}.zip"
          test -f "resume_pack.zip"
          test -f "snapshots/${RUN_ID}/manifest.json"

      - name: Locate outputs
        shell: bash
        run: |
          set -euo pipefail
          echo "EVIDENCE_ZIP=lockpack_evidence-${RUN_ID}.zip" >> "$GITHUB_ENV"
          echo "RESUME_ZIP=resume_pack.zip" >> "$GITHUB_ENV"
          test -f "${EVIDENCE_ZIP}"
          test -f "${RESUME_ZIP}"

      - name: Attest evidence (provenance)
        id: attest_evidence
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.EVIDENCE_ZIP }}

      - name: Attest resume (provenance)
        id: attest_resume
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.RESUME_ZIP }}

      - name: Upload payload (evidence + snapshot)
        uses: actions/upload-artifact@v4
        with:
          name: lockpack-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.EVIDENCE_ZIP }}
            ${{ env.RESUME_ZIP }}
            evidence/${{ env.RUN_ID }}/QG.json
            evidence/${{ env.RUN_ID }}/manifest.json
            snapshots/${{ env.RUN_ID }}/manifest.json

      - name: Final commit status (lockpack)
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" ]]; then
            STATE="success"
            DESC="LOCKPACK PASS (GATE 2)"
          else
            STATE="failure"
            DESC="LOCKPACK FAIL (see Actions run)"
          fi

          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${STATE}" \
            -f context="lockpack" \
            -f description="${DESC}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
